services:
  postgres:
    container_name: homework
    image: postgres:18
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $$POSTGRES_DB']
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
